version: v2
inputs:
  - directory: proto
plugins:
  # server
  - local: protoc-gen-go
    out: ./server/interal/proto/tggen
    opt:
      - module=demo/interal/proto/tggen
  - local: protoc-gen-connect-go
    out: ./server/interal/proto/tggen
    opt:
      - module=demo/interal/proto/tggen

  # tg
  - local: protoc-gen-es
    out: ./tg/src/proto
    opt: target=ts
  - local: protoc-gen-connect-es
    out: ./tg/src/proto
    opt: target=ts

syntax = "proto3";

//

import "google/protobuf/timestamp.proto";

//

package api;
option go_package = "demo/interal/proto/apigen";

// SERVICE

service PingService {
	rpc Ping(PingRequest) returns (PingResponse) {}
}

// Ping

message PingRequest {
	string msg = 1;
}

message PingResponse {
	string response = 1;
	google.protobuf.Timestamp timestamp = 2;
}

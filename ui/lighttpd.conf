server.modules = (
    "mod_access",
    "mod_accesslog",
    "mod_rewrite"
)

server.document-root        = "/app/www"
server.port                 = 80
server.username             = "lighttpd"
server.groupname            = "lighttpd"

index-file.names            = ( "index.html" )
url.access-deny             = ( "~", ".inc" )

mimetype.assign = (
	".html" => "text/html", 
	".txt"  => "text/plain",
	".css"  => "text/css",
	".js"   => "application/javascript",
	".json" => "application/json",
	".png"  => "image/png",
	".jpg"  => "image/jpeg",
	".jpeg" => "image/jpeg",
	".gif"  => "image/gif",
	".svg"  => "image/svg+xml",
	".ico"  => "image/x-icon"
)

# Critical fallback routing rule for Vue SPA routing
url.rewrite-if-not-file = (
    "^/.*$" => "/index.html"
)
